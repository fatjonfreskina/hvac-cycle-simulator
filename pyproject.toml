[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-cycle-simulator"
version = "0.1.0"
description = "An educational vapor-compression cycle simulator for HVAC engineers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["CoolProp==7.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.8,<4"]

[project.scripts]
hvac-cycle = "hvac_cycle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hvac_cycle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
